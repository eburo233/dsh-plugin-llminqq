# NapCatQQ (OneBot 11 协议端) —— 让 DSH/LLM 接入「真实 QQ 号」
#
# 独立 compose 项目，不碰机器上任何既有容器/网络。
#   - 6099: WebUI（扫码登录、看状态），只绑 127.0.0.1
#   - 3001: OneBot 11 正向 WebSocket + HTTP，只绑 127.0.0.1
# 数据卷落在 ./data 下，登录态可复用。
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: llminqq-napcat
    restart: unless-stopped
    environment:
      # 正向 WS：由我们自己的桥主动连 3001
      MODE: ws
      # 快速登录：带 -q 启动，掉线重启后免扫码（需已存在登录记录）
      ACCOUNT: ${ACCOUNT:-2511519116}
      WEBUI_TOKEN: ${WEBUI_TOKEN:-llminqq-2026}
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      TZ: Asia/Shanghai
    ports:
      - "6099:6099"          # WebUI：局域网可访问（有 token 保护），方便随时看实时二维码
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
      - ./data/cache:/app/napcat/cache
    shm_size: 256m
    # QQ 客户端是 Electron，无 GPU/DBus 也能跑；给点余量避免 OOM
    mem_limit: 2g
